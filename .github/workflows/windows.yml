name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          $version = ([xml](Get-Content -LiteralPath Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag '$env:GITHUB_REF_NAME' must be vX.Y.Z and match Directory.Build.props (version '$version')."
          }

      - name: Set up Node.js x64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Set up local .NET SDK
        run: ./scripts/bootstrap.ps1

      - name: Install web dependencies
        working-directory: src/SideWidget.Web
        run: npm ci --no-fund

      - name: Run core, remote, and web checks
        run: ./scripts/test.ps1

      - name: Run Windows checks
        run: ./scripts/test-windows.ps1 -Configuration Release

      - name: Run display coordinator checks
        run: ./.tools/dotnet/dotnet.exe run --project tests/SideWidget.Displays.Tests -c Release

      - name: Build the portable Windows app
        run: ./scripts/build.ps1 -SkipWeb

      - name: Package the tagged build
        if: github.ref_type == 'tag'
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assembly = Join-Path $PWD 'artifacts/release/SideWidget.App.dll'
          $builtVersion = [Reflection.AssemblyName]::GetAssemblyName($assembly).Version
          if ($builtVersion -ne [version]"$version.0") {
            throw "Built app version '$builtVersion' does not match $env:GITHUB_REF_NAME."
          }
          ./scripts/package.ps1 -OutputArchive "artifacts/github-release/SideWidget-$version-win-x64.zip"

      - name: Upload release files
        id: release-files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-release
          path: artifacts/github-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

    outputs:
      artifact-id: ${{ steps.release-files.outputs.artifact-id }}

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release files from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Verify ZIP checksum
        working-directory: release
        shell: bash
        run: sha256sum --check --strict "SideWidget-${GITHUB_REF_NAME#v}-win-x64.zip.sha256"

      - name: Publish ZIP and checksum
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="SideWidget-${GITHUB_REF_NAME#v}-win-x64.zip"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "SideWidget $GITHUB_REF_NAME" --generate-notes
