name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          $version = ([xml](Get-Content -LiteralPath Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag '$env:GITHUB_REF_NAME' must be vX.Y.Z and match Directory.Build.props (version '$version')."
          }

      - name: Set up Node.js x64
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Set up local .NET SDK
        run: ./scripts/bootstrap.ps1

      - name: Validate translation catalogs
        run: node ./scripts/check-locales.mjs

      - name: Install web dependencies
        working-directory: src/SideWidget.Web
        run: npm ci --no-fund

      - name: Run core, remote, and web checks
        run: ./scripts/test.ps1

      - name: Run Windows checks
        run: ./scripts/test-windows.ps1 -Configuration Release

      - name: Run display coordinator checks
        run: ./.tools/dotnet/dotnet.exe run --project tests/SideWidget.Displays.Tests -c Release

      - name: Build the portable Windows app
        run: ./scripts/build.ps1 -SkipWeb

      - name: Smoke-test the portable Windows app
        run: ./scripts/test-portable.ps1

      - name: Build the Lite Windows app
        run: ./scripts/build.ps1 -SkipWeb -Lite

      - name: Set up shared runtimes for Lite smoke test
        run: |
          # VC++ x64 is part of the Windows Server 2025 runner image.
          # The local SDK already includes the .NET and ASP.NET Core 10 x64 runtimes.
          $windowsAppRuntime = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.8/1.8.260921001/windowsappruntimeinstall-x64.exe' -OutFile $windowsAppRuntime
          $process = Start-Process -FilePath $windowsAppRuntime -ArgumentList '--quiet' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows App Runtime installer failed ($($process.ExitCode))." }

          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = Get-ItemPropertyValue -LiteralPath "HKLM:\SOFTWARE\WOW6432Node\$client","HKCU:\SOFTWARE\$client" -Name pv -ErrorAction SilentlyContinue
          if (-not ($versions | Where-Object { $_ -and $_ -ne '0.0.0.0' })) {
            $webView = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webView
            $process = Start-Process -FilePath $webView -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Evergreen WebView2 installer failed ($($process.ExitCode))." }
          }

      - name: Smoke-test the Lite Windows app
        run: ./scripts/test-portable.ps1 -Lite -DotnetRoot .tools/dotnet

      - name: Package the tagged builds
        if: github.ref_type == 'tag'
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($edition in @('release', 'release-lite')) {
            $assembly = Join-Path $PWD "artifacts/$edition/SideWidget.App.dll"
            $builtVersion = [Reflection.AssemblyName]::GetAssemblyName($assembly).Version
            if ($builtVersion -ne [version]"$version.0") {
              throw "Built app version '$builtVersion' does not match $env:GITHUB_REF_NAME."
            }
          }
          $legacyArchive = "artifacts/github-release/SideWidget-$version-win-x64.zip"
          $portableArchive = "artifacts/github-release/SideWidget-$version-portable-win-x64.zip"
          $liteArchive = "artifacts/github-release/SideWidget-$version-lite-win-x64.zip"
          ./scripts/package.ps1 -OutputArchive $legacyArchive
          ./scripts/package-clean.ps1 -ReleaseDirectory artifacts/release -OutputArchive $portableArchive -PayloadArchive $legacyArchive
          ./scripts/package-clean.ps1 -Lite -ReleaseDirectory artifacts/release-lite -OutputArchive $liteArchive
          ./scripts/test-portable.ps1 -Archive $portableArchive
          ./scripts/test-portable.ps1 -Archive $liteArchive -Lite -DotnetRoot .tools/dotnet

      - name: Upload release files
        id: release-files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: artifacts/github-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

    outputs:
      artifact-id: ${{ steps.release-files.outputs.artifact-id }}

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release files from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Verify ZIP checksums
        working-directory: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256sum --check --strict "SideWidget-$version-win-x64.zip.sha256" \
            "SideWidget-$version-portable-win-x64.zip.sha256" "SideWidget-$version-lite-win-x64.zip.sha256"

      - name: Publish ZIPs and checksums
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=()
          for edition in '' '-portable' '-lite'; do
            archive="SideWidget-$version$edition-win-x64.zip"
            files+=("$archive" "$archive.sha256")
          done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "SideWidget $GITHUB_REF_NAME" --generate-notes
