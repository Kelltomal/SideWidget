name: Feature request
description: Suggest an improvement to SideWidget.
body:
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: Describe the task and the part that is hard today.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What behavior would help?
    validations:
      required: true
